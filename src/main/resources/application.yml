app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M

server:
  port: ${SERVER_PORT:7080}

spring:
  jpa:
    hibernate:
      ddl-auto: validate     # Hibernate only checks
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    flyway:
      enabled: true            # Flyway owns the schema

  application:
    name: inventory-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventory_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
